version: '3.8'

services:
  api:
    build: .
    container_name: ledger_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/transaction_ledger
      - USE_IN_MEMORY_DB=false
      - DEFAULT_PAGE_LIMIT=10
      - MAX_PAGE_LIMIT=100
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    container_name: ledger_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
